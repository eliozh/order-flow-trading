[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "oft"
version = "0.1.0"
description = "Order-flow trading system: local market data, deterministic metrics, API, CLI, and web terminal."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "apscheduler>=3.10.4,<4",
  "duckdb>=1.1.3",
  "fastapi>=0.115.5",
  "httpx>=0.28.0",
  "jsonschema>=4.23.0",
  "pydantic>=2.10.2",
  "pydantic-settings>=2.6.1",
  "pyarrow>=18.1.0",
  "starlette>=1.10.0",
  "structlog>=24.4.0",
  "typer>=0.15.0",
  "uvicorn[standard]>=0.32.1",
  "websockets>=13.0",
  "keyring>=25.7.0",
  "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
  "import-linter>=2.0",
  "mypy>=1.13.0",
  "pytest>=8.3.4",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.1",
]

[project.scripts]
oft = "oft.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oft"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "fixture_large: tests that require externally downloaded fixtures",
  "live_smoke: opt-in tests that hit the public archive (set OFT_LIVE_SMOKE=1)",
  "replay: deterministic replay tests (no network, no wall clock)",
]

[tool.coverage.run]
source = ["oft"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.importlinter]
root_packages = ["oft"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain imports only the standard library and Pydantic"
type = "forbidden"
source_modules = ["oft.domain"]
# ClockPort is a typing-only protocol; importing it in a domain annotation is
# the single sanctioned exception. It adds no adapter, I/O, or framework code.
ignore_imports = ["oft.domain.metrics.liquidations -> oft.ports.clock"]
forbidden_modules = [
  "oft.adapters",
  "oft.api",
  "oft.application",
  "oft.bootstrap",
  "oft.cli",
  "oft.clock",
  "oft.config",
  "oft.logging",
  "oft.ports",
  "oft.replay",
  "apscheduler",
  "duckdb",
  "fastapi",
  "pyarrow",
  "structlog",
  "typer",
  "uvicorn",
  "websockets",
  "numpy",
  "httpx",
  "sqlite3",
  "litellm",
  "mistralai",
  "ollama",
  "langchain",
  "llama_index",
]

[[tool.importlinter.contracts]]
name = "API never imports adapters or provider SDKs directly"
type = "forbidden"
# Application services may read adapters today; the API boundary is about
# direct coupling. Indirect chains through the application layer are allowed,
# a direct adapter/provider import is not.
allow_indirect_imports = true
source_modules = ["oft.api"]
ignore_imports = [
  "oft.api.app -> oft.adapters.fixture_market_data",
]
forbidden_modules = [
  "oft.adapters",
  "anthropic",
  "ccxt",
  "cohere",
  "google",
  "groq",
  "langchain",
  "litellm",
  "llama_index",
  "mistralai",
  "ollama",
  "openai",
]

# The execution/broker path is the last line of defense (ADR-0006): it must not
# reach a provider SDK or an adapter directly. Read models stay in application.
[[tool.importlinter.contracts]]
name = "Execution path never imports adapters or provider SDKs"
type = "forbidden"
source_modules = [
  "oft.application.entry_service",
  "oft.application.execution_gateway",
  "oft.application.paper_broker",
]
forbidden_modules = [
  "oft.adapters",
  "anthropic",
  "ccxt",
  "cohere",
  "google",
  "groq",
  "langchain",
  "litellm",
  "llama_index",
  "mistralai",
  "ollama",
  "openai",
]

# Slice 11 security negative: adapters must never reach the execution/broker
# layer or a provider. The application ban is fail-closed for future
# `oft.application.execution`/`broker` modules; the only sanctioned edges are
# the shared rate-limiter value objects.
[[tool.importlinter.contracts]]
name = "Adapters never import execution or provider modules"
type = "forbidden"
source_modules = ["oft.adapters.**"]
ignore_imports = [
  "oft.adapters.binance_rest -> oft.application.rate_limiter",
  "oft.adapters.binance_ws -> oft.application.rate_limiter",
]
forbidden_modules = [
  "oft.application",
  "anthropic",
  "ccxt",
  "cohere",
  "google",
  "groq",
  "langchain",
  "litellm",
  "llama_index",
  "mistralai",
  "ollama",
  "openai",
  "binance",
  "binance_connector",
]

# Slice 21: the LLM adapter family is the untrusted provider boundary. It must
# never reach the execution/broker path or a Binance client, even indirectly
# through a shared helper. This is narrower and explicit alongside the broader
# adapter contract above; neither is weakened.
[[tool.importlinter.contracts]]
name = "LLM adapters never import execution, broker, or Binance modules"
type = "forbidden"
source_modules = [
  "oft.adapters.llm_common",
  "oft.adapters.llm_stub",
  "oft.adapters.llm_openai",
  "oft.adapters.llm_anthropic",
  "oft.adapters.llm_deepseek",
]
forbidden_modules = [
  "oft.application.entry_service",
  "oft.application.execution_gateway",
  "oft.application.paper_broker",
  "oft.application.paper_account",
  "oft.application.kill_switch",
  "oft.adapters.binance_rest",
  "oft.adapters.binance_ws",
  "binance",
  "binance_connector",
  "ccxt",
]

# Slice 31: the management/review decision layer is advisory and must never
# reach the execution gateway, the paper broker, or a Binance client directly.
# Both services legitimately reach execution *indirectly* through the position
# and order services, so only direct imports are forbidden here. The LLM adapter
# contract above stays narrower (it also forbids indirect chains) and is not
# weakened.
[[tool.importlinter.contracts]]
name = "Management and review services never import execution, broker, or Binance modules"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
  "oft.application.management_service",
  "oft.application.review_service",
]
forbidden_modules = [
  "oft.application.execution_gateway",
  "oft.application.paper_broker",
  "oft.adapters.binance_rest",
  "oft.adapters.binance_ws",
  "binance",
  "binance_connector",
  "ccxt",
]

# The provider boundary is a denylist of every LLM SDK the project may add; the
# list is intentionally broad so a new adapter import fails closed.
[[tool.importlinter.contracts]]
name = "No LLM, execution, or broker provider imports exist yet"
type = "forbidden"
source_modules = ["oft"]
forbidden_modules = [
  "anthropic",
  "ccxt",
  "cohere",
  "google",
  "groq",
  "langchain",
  "litellm",
  "llama_index",
  "mistralai",
  "ollama",
  "openai",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["src/oft"]
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true
