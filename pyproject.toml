[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "oft"
version = "0.1.0"
description = "Order-flow trading system: local market data, deterministic metrics, API, CLI, and web terminal."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "apscheduler>=3.10.4,<4",
  "duckdb>=1.1.3",
  "fastapi>=0.115.5",
  "pydantic>=2.10.2",
  "pydantic-settings>=2.6.1",
  "pyarrow>=18.1.0",
  "structlog>=24.4.0",
  "typer>=0.15.0",
  "uvicorn[standard]>=0.32.1",
  "websockets>=13.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "import-linter>=2.0",
  "jsonschema>=4.23.0",
  "mypy>=1.13.0",
  "pytest>=8.3.4",
  "pytest-cov>=6.0.0",
  "ruff>=0.17.3",
]

[project.scripts]
oft = "oft.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oft"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "fixture_large: tests that require externally downloaded fixtures",
  "live_smoke: opt-in tests that hit the public archive (set OFT_LIVE_SMOKE=1)",
  "replay: deterministic replay tests (no network, no wall clock)",
]

[tool.coverage.run]
source = ["oft"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.importlinter]
root_packages = ["oft"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain imports only the standard library and Pydantic"
type = "forbidden"
source_modules = ["oft.domain"]
# ClockPort is a typing-only protocol; importing it in a domain annotation is
# the single sanctioned exception. It adds no adapter, I/O, or framework code.
ignore_imports = ["oft.domain.metrics.liquidations -> oft.ports.clock"]
forbidden_modules = [
  "oft.adapters",
  "oft.api",
  "oft.application",
  "oft.bootstrap",
  "oft.cli",
  "oft.clock",
  "oft.config",
  "oft.logging",
  "oft.ports",
  "oft.replay",
  "apscheduler",
  "duckdb",
  "fastapi",
  "pyarrow",
  "structlog",
  "typer",
  "uvicorn",
  "websockets",
  "numpy",
  "httpx",
  "sqlite3",
  "litellm",
  "mistralai",
  "ollama",
  "langchain",
  "llama_index",
]

[[tool.importlinter.contracts]]
name = "API never imports a broker, execution, or LLM module"
type = "forbidden"
source_modules = ["oft.api"]
# Explicitly accepted read-model path: /system -> health/status ->
# ingestion_supervisor -> binance_ws for the WS state file only. These edge
# ignores keep direct API imports of the forbidden modules detectable.
ignore_imports = [
  "oft.api.routes.system -> oft.application.health",
  "oft.api.routes.system -> oft.application.status",
  "oft.application.health -> oft.application.ingestion_supervisor",
  "oft.application.status -> oft.application.ingestion_supervisor",
  "oft.application.ingestion_supervisor -> oft.adapters.binance_ws",
]
forbidden_modules = [
  "oft.adapters.binance_rest",
  "oft.adapters.binance_ws",
  "oft.application.ingestion_supervisor",
  "anthropic",
  "ccxt",
  "openai",
]

# No LLM/execution modules exist in milestone 1. This contract fails closed on
# the provider/execution SDKs that would introduce them; adding an `oft.llm`,
# `oft.execution`, or `oft.broker` package requires extending this contract.
[[tool.importlinter.contracts]]
name = "No LLM, execution, or broker provider imports exist yet"
type = "forbidden"
source_modules = ["oft"]
forbidden_modules = [
  "anthropic",
  "ccxt",
  "openai",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["src/oft"]
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true
