[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "oft"
version = "0.1.0"
description = "Order-flow trading system: local market data, deterministic metrics, API, CLI, and web terminal."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "apscheduler>=3.10.4,<4",
  "duckdb>=1.1.3",
  "fastapi>=0.115.5",
  "pydantic>=2.10.2",
  "pydantic-settings>=2.6.1",
  "pyarrow>=18.1.0",
  "structlog>=24.4.0",
  "typer>=0.15.0",
  "uvicorn[standard]>=0.32.1",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "mypy>=1.13.0",
  "pytest>=8.3.4",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.1",
]

[project.scripts]
oft = "oft.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oft"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["fixture_large: tests that require externally downloaded fixtures"]

[tool.coverage.run]
source = ["oft"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["src/oft"]
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true
