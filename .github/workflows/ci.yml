name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Install web dependencies
        run: npm ci --prefix web

      # Offline equivalent of the documented local gate: ruff, mypy,
      # import-linter, fixture checksums, pytest (unit/integration/contract/
      # replay) with the 80% floor and the metric branch gate, then frontend
      # lint/typecheck/test/build, then a wheel build whose Requires-Dist
      # metadata and clean-venv CLI run are verified. No network or daemon is
      # used.
      - name: make ci
        run: make ci

      # Explicit, independently addressable wheel packaging gate.
      - name: verify wheel runtime dependencies
        run: make wheel-check

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Install Playwright Chromium
        run: npx --prefix web playwright install --with-deps chromium

      - name: Build web
        run: npm --prefix web run build

      - name: Run e2e against isolated daemons
        run: npm --prefix web run test:e2e
